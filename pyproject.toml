[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "directed-evolution-codon-space"
version = "0.1.0"
description = "Refinement of pre-optimized coding DNA sequences (Directed Evolution in Codon Space)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "biopython",
    "torch",
    "transformers",
    "scikit-learn",
    "tqdm",
]

[tool.setuptools]
package-dir = {"" = "scripts"}
py-modules = ["evolve", "codon_utils"]